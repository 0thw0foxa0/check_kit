name: cmake-multi-platform

on:
  push:
    branches:
      - testhtml
  pull_request:
    branches:
      - testhtml

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-18.04  # Старая LTS
          - ubuntu-20.04  # Средняя LTS
          - ubuntu-22.04  # Новая LTS
          - windows-2016  # Старая версия Windows
          - windows-2019  # Средняя версия Windows
          - windows-2022  # Новая версия Windows
        compiler:
          - { os-pattern: 'Ubuntu', name: 'gcc-9', install: 'g++-9' }  # Доступен на всех версиях
          - { os-pattern: 'Ubuntu', name: 'gcc-10', install: 'g++-10' }
          - { os-pattern: 'Ubuntu', name: 'gcc-11', install: 'g++-11' }
          - { os-pattern: 'windows', name: 'msvc', install: '' }
          - { os-pattern: 'windows', name: 'mingw', install: 'mingw' }
        exclude:
          - os: ubuntu-18.04
            compiler: { os-pattern: 'windows' }
          - os: ubuntu-20.04
            compiler: { os-pattern: 'windows' }
          - os: ubuntu-22.04
            compiler: { os-pattern: 'windows' }
          - os: windows-2016
            compiler: { os-pattern: 'Ubuntu' }
          - os: windows-2019
            compiler: { os-pattern: 'Ubuntu' }
          - os: windows-2022
            compiler: { os-pattern: 'Ubuntu' }
      fail-fast: false  # Не отменять остальные jobs при ошибке

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: contains(matrix.os, 'Ubuntu')
        run: |
          sudo apt-get update
          # Добавляем репозиторий для старых версий GCC
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.compiler.install }}
          # Устанавливаем выбранный компилятор как стандартный
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/${{ matrix.compiler.name }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/${{ matrix.compiler.install }} 100

      - name: Install dependencies (Windows - MinGW)
        if: contains(matrix.os, 'windows') && matrix.compiler.name == 'mingw'
        run: |
          choco install cmake --version=3.28.1 -y
          choco install mingw -y

      - name: Install dependencies (Windows - MSVC)
        if: contains(matrix.os, 'windows') && matrix.compiler.name == 'msvc'
        run: |
          choco install cmake --version=3.28.1 -y

      - name: Configure CMake (Ubuntu)
        if: contains(matrix.os, 'Ubuntu')
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_CXX_COMPILER=${{ matrix.compiler.install }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows - MSVC)
        if: contains(matrix.os, 'windows') && matrix.compiler.name == 'msvc'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows - MinGW)
        if: contains(matrix.os, 'windows') && matrix.compiler.name == 'mingw'
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cd build
          cmake --build . --config Release

      - name: Run tests (Ubuntu)
        if: contains(matrix.os, 'Ubuntu')
        run: |
          cd build
          ./my_program 23
          ./my_program 5

      - name: Run tests (Windows)
        if: contains(matrix.os, 'windows')
        run: |
          cd build
          .\my_program.exe 23
          .\my_program.exe 5

      - name: Verify output (Ubuntu)
        if: contains(matrix.os, 'Ubuntu')
        run: |
          cd build
          ./my_program 23 | grep "автомобиль" || echo "Test failed: автомобиль not found"
          ./my_program 23 | grep "автобус" || echo "Test failed: автобус not found"
          ./my_program 5 | grep "НЕИЗВЕСТНЫЙ ТИП ТРАНСПОРТА" || echo "Test failed: unknown type not detected"
        shell: bash

      - name: Verify output (Windows)
        if: contains(matrix.os, 'windows')
        run: |
          cd build
          # Используем findstr вместо grep и учитываем возможные проблемы с кодировкой
          .\my_program.exe 23 | findstr "car" || echo "Test failed: car not found"
          .\my_program.exe 23 | findstr "bus" || echo "Test failed: bus not found"
          .\my_program.exe 5 | findstr "UNKNOWN" || echo "Test failed: unknown type not detected"
        shell: cmd
